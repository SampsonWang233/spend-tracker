<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>My Spend Tracker · Detail</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container details-page">
        <header class="primary-header">
            <div class="header-row">
                <h1>Expense Detail</h1>
                <nav class="tab-nav" aria-label="Page navigation">
                    <a href="details.html" id="navAddExpense" class="tab-link">Add Expense</a>
                    <a href="detail.html" class="tab-link tab-active" aria-current="page">Detail</a>
                    <a href="index.html" id="navSummary" class="tab-link">Summary</a>
                </nav>
            </div>
            <p class="header-subtitle">View, filter, and manage your expenses.</p>
        </header>

        <main class="details-layout">
            <section class="expenses-section">
                <div class="section-header">
                    <h2>Expenses</h2>
                    <div class="expenses-controls">
                        <select id="categoryFilter" class="category-filter" aria-label="Filter by category">
                            <option value="all">All Categories</option>
                            <option value="dining">Dining</option>
                            <option value="shopping">Shopping</option>
                            <option value="transport">Transport</option>
                            <option value="housing">Housing</option>
                            <option value="grocery">Grocery</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="bills">Bills</option>
                        </select>
                        <button id="clearMonth" class="btn btn-secondary">Clear Month</button>
                    </div>
                </div>
                <div id="categoryTotal" class="category-total" style="display: none;">
                    <span class="category-total-label">Total:</span>
                    <span class="category-total-amount" id="categoryTotalAmount">$0.00</span>
                </div>
                <div id="expensesList" class="expenses-list">
                    <p class="empty-state">No expenses yet. Add your first expense above!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config (add your credentials here) -->
    <script src="firebase-config.js"></script>
    
    <!-- Fixed Expenses (load before tracker.js) -->
    <script src="fixed-expenses.js"></script>
    
    <!-- App Scripts -->
    <script src="tracker.js"></script>
    <script src="detail.js"></script>
</body>
</html>
