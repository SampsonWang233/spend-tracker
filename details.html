<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>My Spend Tracker · Add Expense</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container details-page">
        <header class="primary-header">
            <div class="header-row">
                <h1>Add Expense</h1>
                <nav class="tab-nav" aria-label="Page navigation">
                    <a href="details.html" class="tab-link tab-active" aria-current="page">Add Expense</a>
                    <a href="detail.html" id="navDetail" class="tab-link">Detail</a>
                    <a href="index.html" id="navSummary" class="tab-link">Summary</a>
                </nav>
            </div>
            <p class="header-subtitle">Add new expense entries quickly and easily.</p>
        </header>

        <main class="details-layout">
            <section class="add-expense-section">
                <div class="section-header">
                    <h2>Add Expense</h2>
                </div>
                <form id="expenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="expenseDescription">Description</label>
                        <input type="text" id="expenseDescription" placeholder="e.g., Groceries, Coffee..." required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expenseAmount">Amount</label>
                            <input type="number" id="expenseAmount" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="expenseCategory">Category</label>
                            <select id="expenseCategory" required>
                                <option value="dining">Dining</option>
                                <option value="shopping">Shopping</option>
                                <option value="transport">Transport</option>
                                <option value="housing">Housing</option>
                                <option value="grocery">Grocery</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="bills">Bills</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="expenseDate">Date</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Expense</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config (add your credentials here) -->
    <script src="firebase-config.js"></script>
    
    <!-- Fixed Expenses (load before tracker.js) -->
    <script src="fixed-expenses.js"></script>
    
    <!-- App Scripts -->
    <script src="tracker.js"></script>
    <script src="details.js"></script>
</body>
</html>
