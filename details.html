<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>My Spend Tracker · Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container details-page">
        <header class="primary-header">
            <div class="header-row">
                <a href="index.html" id="summaryLink" class="link-button">← Summary</a>
                <h1>Expense Details</h1>
            </div>
            <p class="header-subtitle">Add, review, and manage each expense entry.</p>
        </header>

        <main class="details-layout">
            <section class="month-selector-card">
                <div class="section-header">
                    <h2>Selected Month</h2>
                    <div class="month-selector">
                        <button id="prevMonth" class="nav-btn" aria-label="Previous month">←</button>
                        <select id="monthSelect" class="month-select" aria-label="Select month"></select>
                        <select id="yearSelect" class="year-select" aria-label="Select year"></select>
                        <button id="nextMonth" class="nav-btn" aria-label="Next month">→</button>
                    </div>
                </div>
                <div class="summary-grid">
                    <div class="summary-card">
                        <span class="label">Total Spent</span>
                        <span id="totalSpent" class="value">$0.00</span>
                    </div>
                    <div class="summary-card">
                        <span class="label">Expenses</span>
                        <span id="expenseCount" class="value">0</span>
                    </div>
                </div>
            </section>

            <section class="add-expense-section">
                <div class="section-header">
                    <h2>Add Expense</h2>
                </div>
                <form id="expenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="expenseDescription">Description</label>
                        <input type="text" id="expenseDescription" placeholder="e.g., Groceries, Coffee..." required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expenseAmount">Amount</label>
                            <input type="number" id="expenseAmount" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="expenseCategory">Category</label>
                            <select id="expenseCategory" required>
                                <option value="food">Food & Dining</option>
                                <option value="transport">Transport</option>
                                <option value="shopping">Shopping</option>
                                <option value="bills">Bills & Utilities</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="health">Health & Fitness</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="expenseDate">Date</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Expense</button>
                </form>
            </section>

            <section class="expenses-section">
                <div class="section-header">
                    <h2>Expenses</h2>
                    <button id="clearMonth" class="btn btn-secondary">Clear Month</button>
                </div>
                <div id="expensesList" class="expenses-list">
                    <p class="empty-state">No expenses yet. Add your first expense above!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="tracker.js"></script>
    <script src="details.js"></script>
</body>
</html>
